<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Opella</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #f7eee6;
      color: #111;
    }
    .card {
      max-width: 420px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(4, 43, 10, .12);
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #ec541e;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.5; color: #5c5c5c; margin: 0 0 24px; }
    a {
      display: inline-block;
      background: #134124;
      color: #f7eee6;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Erro 404</span>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi alterado. Confira o link ou volte para o início.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
